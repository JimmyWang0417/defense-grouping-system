[project]
name = "defense-grouping-system"
version = "0.2.0"
description = "Defense grouping and academic scheduling system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi[standard]>=0.116,<1",
  "flet>=1,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "ortools>=9.15,<10",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "typer>=0.16,<1",
]

# Flet's browser packager reads this supported dependency table before PEP 621.
# Keep the Pyodide payload client-only; the installable project still uses the
# complete runtime dependency list above.
[tool.poetry.dependencies]
python = ">=3.12,<3.15"
flet = ">=1,<2"
httpx = ">=0.28,<1"

[tool.flet]
product = "答辩分组系统"
artifact = "defense-grouping-system"
org = "io.github.jimmywang0417"
bundle_id = "io.github.jimmywang0417.defense_grouping_system"
company = "JimmyWang0417"
copyright = "Copyright © 2026 JimmyWang0417"

[tool.flet.app]
path = "src"
module = "main.py"

[tool.flet.web]
route_url_strategy = "path"
pwa_background_color = "#F7F8FC"
pwa_theme_color = "#1F5AA6"

[dependency-groups]
dev = [
  "flet-cli==1.0.0",
  "flet-web==1.0.0",
  "hypothesis>=6.138,<7",
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "psutil>=7,<8",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
defense-grouping = "defense_grouping.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defense_grouping"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "performance: department-scale tests with explicit time and memory budgets",
  "postgres: PostgreSQL compatibility tests requiring a Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["defense_grouping"]
