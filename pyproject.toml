[project]
name = "defense-grouping-system"
version = "0.1.0"
description = "Defense grouping and academic scheduling system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi[standard]>=0.116,<1",
  "flet>=1,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "ortools>=9.15,<10",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "psutil>=7,<8",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
defense-grouping = "defense_grouping.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defense_grouping"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["defense_grouping"]
