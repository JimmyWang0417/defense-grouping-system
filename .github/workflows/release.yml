name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  wait-for-pr-gate:
    name: Wait for PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Require successful PR Gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "PR Gate") | .conclusion' | tail -n 1)
            if test "$conclusion" = success; then exit 0; fi
            if test "$conclusion" = failure || test "$conclusion" = cancelled; then exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for PR Gate" >&2
          exit 1

  release-please:
    name: Release Please
    needs: wait-for-pr-gate
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Build GitHub release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - name: Upload wheel and source archive
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*.whl dist/*.tar.gz --clobber
